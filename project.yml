name: Kopru
options:
  bundleIdPrefix: dev.kopru
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: tr
  createIntermediateGroups: true
packages:
  KopruCore:
    path: KopruCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "5"
targets:
  Kopru:
    type: application
    platform: macOS
    sources:
      - path: Kopru
      - path: Resources/Recipes
        type: folder
        buildPhase: resources
      - path: Resources/RecipeFiles
        type: folder
        buildPhase: resources
      - path: Resources/Catalog
        type: folder
        buildPhase: resources
    dependencies:
      - package: KopruCore
    info:
      path: Kopru/Info.plist
      properties:
        CFBundleName: Bridge
        CFBundleDisplayName: Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    settings:
      base:
        # Uygulamanın görünen adı Bridge; modül, hedef ve veri klasörü (Application Support/Kopru) iç ad Kopru ile kalır.
        PRODUCT_NAME: Bridge
        PRODUCT_MODULE_NAME: Kopru
        PRODUCT_BUNDLE_IDENTIFIER: dev.kopru.Kopru
        # Kopru/AppIcon.icon (Icon Composer); Xcode eski macOS'lar için düz simgeyi kendisi üretir.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: arm64
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    postBuildScripts:
      # Betik dosyadan çağrılır: `path:` xcodegen'in o anki içeriği projeye gömmesine yol açıyordu ve
      # proje yeniden oluşturulmadıkça betikteki değişiklikler derlemeye geçmiyordu.
      - name: Motoru pakete kopyala (yalnızca Release)
        script: '"${SRCROOT}/Scripts/bundle-engine.sh"'
        basedOnDependencyAnalysis: false
schemes:
  Kopru:
    build:
      targets:
        Kopru: all
    run:
      config: Debug
    archive:
      config: Release
