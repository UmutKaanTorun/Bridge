<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Köprü Kur Ekranı</title>
<style>
:root{
  --desk:#dcdde3; --win:#ffffff; --side:#f2f2f5; --insp:#fafafb;
  --text:#1d1d1f; --text2:#6e6e73; --text3:#a1a1a6; --sep:rgba(0,0,0,.09);
  --field:rgba(0,0,0,.05); --hover:rgba(0,0,0,.04); --sel:rgba(0,0,0,.07);
  --accent:#0a7aff; --accent-bg:rgba(10,122,255,.10); --on-accent:#fff;
  --ok:#1a7f45; --ok-bg:#e2f4e8; --works:#0b6f8a; --works-bg:#def1f6;
  --part:#8a5a00; --part-bg:#fbefd6; --bad:#b42318; --bad-bg:#fde8e6;
  --test:#5f5e66; --test-bg:#ececf0; --run:#30c158;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#121214; --win:#1e1e20; --side:#252528; --insp:#232326;
    --text:#f2f2f4; --text2:#a1a1a8; --text3:#6c6c72; --sep:rgba(255,255,255,.09);
    --field:rgba(255,255,255,.07); --hover:rgba(255,255,255,.05); --sel:rgba(255,255,255,.09);
    --accent:#3b95ff; --accent-bg:rgba(59,149,255,.16);
    --ok:#5fd38d; --ok-bg:rgba(95,211,141,.14); --works:#5cc8e6; --works-bg:rgba(92,200,230,.14);
    --part:#f2b84b; --part-bg:rgba(242,184,75,.14); --bad:#ff8a7e; --bad-bg:rgba(255,138,126,.14);
    --test:#b4b4bc; --test-bg:rgba(255,255,255,.08);
  }
}
:root{color-scheme:light dark}
*{box-sizing:border-box}
.main::-webkit-scrollbar,.ibody::-webkit-scrollbar{width:0}
html,body{margin:0;height:100%}
body{background:var(--desk);font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;transform-origin:center}
.win{position:relative;width:1280px;height:800px;background:var(--win);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:224px 1fr 340px;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 24px 60px rgba(0,0,0,.22)}
.side{background:var(--side);border-right:.5px solid var(--sep);display:flex;flex-direction:column;padding:14px 10px 10px}
.lights{display:flex;gap:8px;padding:2px 6px 18px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.brand{display:flex;align-items:center;gap:8px;padding:0 8px 16px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:default;color:var(--text)}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel);font-weight:500}
.nav svg{flex:none;color:var(--accent)}
.sh{font-size:11px;font-weight:600;color:var(--text3);padding:16px 8px 4px}
.mini{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--run);margin-left:auto}
.side .grow{flex:1}
.addb{display:flex;align-items:center;gap:6px;color:var(--text2);padding:6px 8px;border-radius:7px}
.addb:hover{background:var(--hover)}
.main{overflow:auto;padding:30px 28px 28px}
.top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1}
.search{position:relative;flex:0 0 280px}
.search input{width:100%;height:34px;border-radius:9px;border:0;background:var(--field);padding:0 64px 0 38px;font:inherit;font-size:14px;color:var(--text);outline:none}
.search input:focus{box-shadow:0 0 0 3px var(--accent-bg),0 0 0 1px var(--accent) inset}
.search svg{position:absolute;left:12px;top:9px;color:var(--text2)}
.kbd{position:absolute;right:9px;top:8px;font-size:11px;color:var(--text3);border:.5px solid var(--sep);border-radius:5px;padding:1px 6px;background:var(--win)}
.bar2{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.unl{margin-left:auto;color:var(--text2);white-space:nowrap;cursor:default}
.unl span{color:var(--accent);font-weight:500}
.unl:hover span{text-decoration:underline}
.dropov{position:absolute;top:0;bottom:0;left:224px;right:340px;margin:12px;border:2px dashed var(--accent);border-radius:14px;background:var(--accent-bg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;place-items:center;text-align:center;color:var(--text2);pointer-events:none}
.dropov.on{display:grid}
.dropov b{display:block;color:var(--text);font-size:17px;margin:10px 0 2px}
.dropov svg{color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:nowrap;white-space:nowrap}
.chip{border:0;font:inherit;padding:5px 11px;border-radius:999px;background:var(--field);color:var(--text);cursor:default}
.chip span{color:var(--text3);margin-left:4px}
.chip.on{background:var(--text);color:var(--win)}
.chip.on span{color:var(--win);opacity:.6}
h2{font-size:15px;font-weight:600;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
h2 small{font-size:12px;font-weight:400;color:var(--text2)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:26px}
.card{display:flex;gap:11px;padding:11px;border-radius:12px;border:.5px solid var(--sep);background:var(--win);cursor:default;position:relative;min-height:84px}
.card:hover{background:var(--hover)}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-bg)}
.ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none;letter-spacing:-.02em}
.card .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--text2);font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:1px 0 6px}
.card .body{min-width:0;flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px 2px 6px;border-radius:999px}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.b-sorunsuz{color:var(--ok);background:var(--ok-bg)}
.b-calisiyor{color:var(--works);background:var(--works-bg)}
.b-kismen{color:var(--part);background:var(--part-bg)}
.b-calismiyor{color:var(--bad);background:var(--bad-bg)}
.b-test{color:var(--test);background:var(--test-bg)}
.b-kurulu{color:var(--text2);background:transparent;padding-left:0}
.open{position:absolute;right:10px;bottom:10px;font:inherit;font-size:12px;font-weight:600;border:0;border-radius:999px;padding:3px 12px;background:var(--field);color:var(--accent)}
.empty{grid-column:1/-1;border:1.2px dashed var(--sep);border-radius:12px;padding:22px;text-align:center;color:var(--text2)}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
.insp{background:var(--insp);border-left:.5px solid var(--sep);display:flex;flex-direction:column;min-height:0}
.ibody{padding:30px 22px 16px;overflow:auto;flex:1}
.ihead{display:flex;gap:13px;align-items:center;margin-bottom:14px}
.ihead .ic{width:56px;height:56px;border-radius:13px;font-size:20px}
.ihead h3{margin:0;font-size:18px;letter-spacing:-.01em}
.ihead p{margin:1px 0 0;color:var(--text2);font-size:12px}
.verdict{border-radius:10px;padding:10px 12px;margin-bottom:6px}
.verdict .badge{margin-bottom:6px}
.verdict p{margin:0;color:var(--text)}
.meta{color:var(--text3);font-size:11.5px;margin:0 0 18px}
.sec{font-size:11.5px;font-weight:600;color:var(--text2);margin:16px 0 7px}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:9px;padding:5px 0;align-items:flex-start}
.list li svg{flex:none;margin-top:2px;color:var(--ok)}
.list li .n{flex:none;width:18px;height:18px;border-radius:50%;background:var(--field);display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--text2);margin-top:0}
.list li small{display:block;color:var(--text2);font-size:11.5px}
.foot{border-top:.5px solid var(--sep);padding:14px 22px 18px;background:var(--insp)}
.lab{font-size:11.5px;color:var(--text2);margin-bottom:5px;display:block}
.inp{width:100%;height:30px;border-radius:7px;border:.5px solid var(--sep);background:var(--win);padding:0 9px;font:inherit;color:var(--text);margin-bottom:12px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.row{display:flex;align-items:center;gap:10px}
.btn{white-space:nowrap;font:inherit;font-weight:600;border:0;border-radius:8px;height:32px;padding:0 18px;background:var(--accent);color:var(--on-accent);cursor:default}
.btn:active{transform:scale(.98)}
.btn.sec2{background:var(--field);color:var(--text);font-weight:500}
.btn.wide{flex:1}
.hint{color:var(--text3);font-size:11.5px}
.bar{height:5px;border-radius:3px;background:var(--field);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.st li{color:var(--text2)}
.st li.done{color:var(--text)}
.st li.now{color:var(--text);font-weight:500}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--field);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none;margin-top:2px}
@keyframes sp{to{transform:rotate(360deg)}}
.circ{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--sep);flex:none;margin-top:2px}
</style>
</head>
<body>
<div id="stage">
<div class="win" id="win">
  <aside class="side">
    <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18h18"/><path d="M5 18v-4a7 7 0 0 1 14 0v4"/><path d="M9 18v-3M15 18v-3M12 18v-4"/></svg>
      Köprü
    </div>
    <div class="nav on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Program kur</div>
    <div class="sh">Bottle'lar</div>
    <div id="bottles"></div>
    <div class="grow"></div>
    <div class="addb"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Boş bottle</div>
  </aside>

  <main class="main" id="main">
    <div class="top">
    <h1>Program kur</h1>
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Program ara" autocomplete="off">
      <span class="kbd">⌘F</span>
    </div>
    </div>
    <div class="bar2">
      <div class="chips" id="chips"></div>
      <span class="unl" id="drop" title="Kurulum dosyasını (.exe, .msi) pencereye sürükleyebilirsin">Listede yok mu? <span>Dosya seç…</span></span>
    </div>
    <div id="sections"></div>
  </main>

  <section class="insp" id="insp"></section>
  <div class="dropov" id="dropov"><div>
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14l3 3 3-3"/></svg>
    <b>Bırak, kuralım</b>.exe ve .msi kurulum dosyaları
  </div></div>
</div>
</div>

<script>
const C={sorunsuz:"Sorunsuz",calisiyor:"Çalışıyor",kismen:"Kısmen çalışıyor",calismiyor:"Şimdilik çalışmıyor",test:"Test ediliyor"};
const CATS=[["tumu","Tümü"],["oyun","Oyun"],["finans","İş ve muhasebe"],["muh","Mühendislik"],["ofis","Ofis"]];
const P=[
 {id:"steam",n:"Steam",by:"Valve",s:"Oyun mağazası ve başlatıcısı",cat:"oyun",r:"calisiyor",bg:"#1b2838",m:"S",
  v:"Mağaza, kütüphane, indirme ve oyunlar açılıyor. Oyun içi Steam katmanı kapalı.",
  size:"2 MB, ilk açılışta yaklaşık 400 MB güncelleme",time:"Yaklaşık 4 dk",
  auto:[["Tarayıcı yardımcısı düzeltmesi","Mağaza penceresi siyah açılmaz"],["Sanal masaüstü","Pencere kaymaz, kesilmez"],["Steam katmanı kapalı","Oyun açılırken çökmeyi önler"],["MSync açık","Oyunlarda daha akıcı kare hızı"]]},
 {id:"npp",n:"Notepad++",by:"Don Ho",s:"Kod ve metin düzenleyici",cat:"ofis",r:"sorunsuz",bg:"#3f8f3a",m:"N++",
  v:"Düzenleme, eklentiler ve Türkçe karakterler sorunsuz.",size:"6 MB",time:"1 dakikadan kısa",auto:[["Türkçe yerel ayar","Menüler ve tarih biçimi Türkçe"]]},
 {id:"winrar",n:"WinRAR",by:"win.rar GmbH",s:"Arşivleme, RAR ve ZIP açma",cat:"ofis",r:"sorunsuz",bg:"#6b3fa0",m:"R",installed:"WinRAR",
  v:"Arşivleme, açma, test ve .rar ilişkilendirmesi çalışıyor.",size:"4 MB",time:"1 dakikadan kısa",auto:[["Dosya ilişkilendirmesi",".rar dosyaları Finder'dan açılır"]]},
 {id:"epic",n:"Epic Games Store",by:"Epic Games",s:"Oyun mağazası ve başlatıcısı",cat:"oyun",r:"calismiyor",bg:"#2a2a2a",m:"E",
  v:"Başlatıcı ilk kurulumda takılıyor. Yeni motor sürümüyle yeniden deneniyor."},
 {id:"gog",n:"GOG Galaxy",by:"GOG",s:"Oyun mağazası ve başlatıcısı",cat:"oyun",r:"test",bg:"#7a2fbf",m:"G"},
 {id:"bnet",n:"Battle.net",by:"Blizzard",s:"Blizzard oyunlarının başlatıcısı",cat:"oyun",r:"test",bg:"#1466c6",m:"B"},
 {id:"logo",n:"Logo Go 3",by:"Logo Yazılım",s:"Ön muhasebe ve ticari yazılım",cat:"finans",r:"test",bg:"#c8102e",m:"L"},
 {id:"eta",n:"ETA:SQL",by:"ETA Bilgisayar",s:"Ticari ve muhasebe yazılımı",cat:"finans",r:"test",bg:"#e0670f",m:"ETA"},
 {id:"mikro",n:"Mikro Jump",by:"Mikro Yazılım",s:"Ticari ve muhasebe yazılımı",cat:"finans",r:"test",bg:"#0e5aa7",m:"M"},
 {id:"matriks",n:"Matriks Veri Terminali",by:"Matriks",s:"Borsa verisi ve teknik analiz",cat:"finans",r:"test",bg:"#0f6a52",m:"MX"},
 {id:"netcad",n:"NetCAD",by:"Netcad",s:"Harita, CBS ve kadastro",cat:"muh",r:"test",bg:"#00838f",m:"NC"},
 {id:"idecad",n:"ideCAD Statik",by:"ideCAD",s:"Yapı tasarımı ve statik analiz",cat:"muh",r:"test",bg:"#3949ab",m:"iC"}
];
const S={cat:"tumu",q:"",sel:"steam",notify:new Set(),bottles:[{n:"WinRAR",bg:"#6b3fa0",m:"R",run:true},{n:"Oyunlar",bg:"#8e8e93",m:"O"}],job:null,unlisted:false};
const $=id=>document.getElementById(id);
const norm=s=>s.toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i");
const ready=p=>["sorunsuz","calisiyor","kismen"].includes(p.r);
const badge=r=>`<span class="badge b-${r}"><i></i>${C[r]}</span>`;
const ic=(p,cls="")=>`<div class="ic ${cls}" style="background:${p.bg}">${p.m}</div>`;
const check=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

function visible(){const q=norm(S.q.trim());return P.filter(p=>(S.cat==="tumu"||p.cat===S.cat)&&(!q||norm(p.n+" "+p.s+" "+p.by).includes(q)))}

function renderChips(){
  $("chips").innerHTML=CATS.map(([k,l])=>{const n=k==="tumu"?P.length:P.filter(p=>p.cat===k).length;return `<button class="chip ${S.cat===k?"on":""}" data-c="${k}">${l}<span>${n}</span></button>`}).join("");
}
function card(p){
  const inst=p.installed;
  return `<div class="card ${S.sel===p.id&&!S.unlisted?"on":""}" data-id="${p.id}">${ic(p)}<div class="body"><div class="t">${p.n}</div><div class="s">${p.s}</div>${inst?`<span class="badge b-kurulu">${check} Kurulu</span>`:badge(p.r)}</div>${inst?`<button class="open">Aç</button>`:""}</div>`;
}
function renderSections(){
  const v=visible();const a=v.filter(ready),b=v.filter(p=>!ready(p));let h="";
  if(!v.length){h=`<div class="grid"><div class="empty"><b>“${S.q}” için hazır tarif yok</b>Kurulum dosyan varsa pencereye sürükle; Köprü onu yeni bir bottle'a kurar.</div></div>`}
  if(a.length)h+=`<h2>Kurulmaya hazır <small>Köprü ekibi test etti</small></h2><div class="grid">${a.map(card).join("")}</div>`;
  if(b.length)h+=`<h2>Yakında <small>Test ediliyor; hazır olunca haber verelim</small></h2><div class="grid">${b.map(card).join("")}</div>`;
  $("sections").innerHTML=h;
}
function renderBottles(){
  $("bottles").innerHTML=S.bottles.map(b=>`<div class="nav"><div class="mini" style="background:${b.bg}">${b.m}</div>${b.n}${b.run?'<span class="dot" title="Çalışıyor"></span>':""}</div>`).join("");
}
function renderInsp(){
  if(S.unlisted){
    $("insp").innerHTML=`<div class="ibody"><div class="ihead"><div class="ic" style="background:var(--field);color:var(--text2)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></div><div><h3>KurulumDosyasi.exe</h3><p>Listede olmayan program · 48 MB</p></div></div>
    <div class="verdict" style="background:var(--test-bg)">${badge("test")}<p>Bu program için Köprü'de hazır ayar yok. Genel Windows 10 ayarlarıyla kurulur; çoğu program böyle de çalışır.</p></div>
    <div class="sec">Ne olacak</div><ul class="list"><li><span class="n">1</span><div>Windows kurulum penceresi açılır<small>Kurulumu oradan bitirirsin</small></div></li><li><span class="n">2</span><div>Program listeye eklenir<small>Kurulum penceresi kapanınca</small></div></li></ul></div>
    <div class="foot"><label class="lab">Nereye kurulsun</label><select class="inp"><option>Yeni bottle</option>${S.bottles.map(b=>`<option>${b.n}</option>`).join("")}</select><label class="lab">Bottle adı</label><input class="inp" value="KurulumDosyasi"><div class="row"><button class="btn sec2" data-act="back">Vazgeç</button><button class="btn wide">Kur</button></div></div>`;
    return;
  }
  const p=P.find(x=>x.id===S.sel);
  const tone=p.r==="calismiyor"?"var(--bad-bg)":p.r==="test"?"var(--test-bg)":p.r==="sorunsuz"?"var(--ok-bg)":"var(--works-bg)";
  let body=`<div class="ihead">${ic(p)}<div><h3>${p.n}</h3><p>${p.by} · ${p.s}</p></div></div>`;
  if(p.r==="test"){
    body+=`<div class="verdict" style="background:${tone}">${badge("test")}<p>Bu program için kurulum tarifi hazırlanıyor. Testler bitince bildirim gönderelim.</p></div>
    <div class="sec">Kurulum dosyan var mı?</div><p style="margin:0;color:var(--text2)">Hazır tarifi beklemeden dosyayı pencereye sürükleyip genel ayarlarla deneyebilirsin.</p>`;
    $("insp").innerHTML=`<div class="ibody">${body}</div><div class="foot"><div class="row"><button class="btn wide ${S.notify.has(p.id)?"sec2":""}" data-act="notify">${S.notify.has(p.id)?"Hazır olunca bildirilecek ✓":"Hazır olunca haber ver"}</button></div></div>`;
    return;
  }
  body+=`<div class="verdict" style="background:${tone}">${badge(p.r)}<p>${p.v}</p></div><p class="meta">Son test: 20 Kas 2026 · Apple M3 · macOS 26.6</p>`;
  if(p.r==="calismiyor"){
    body+=`<div class="sec">Yine de denemek istersen</div><p style="margin:0;color:var(--text2)">Kurulum dosyasıyla genel ayarlarla kurabilirsin; sorun yaşarsan günlük dosyası bize yardımcı olur.</p>`;
    $("insp").innerHTML=`<div class="ibody">${body}</div><div class="foot"><div class="row"><button class="btn sec2 wide" data-act="unlisted">Yine de dene…</button><button class="btn wide ${S.notify.has(p.id)?"sec2":""}" data-act="notify">${S.notify.has(p.id)?"Bildirilecek ✓":"Haber ver"}</button></div></div>`;
    return;
  }
  body+=`<div class="sec">Köprü senin yerine ayarlar</div><ul class="list">${p.auto.map(([a,b])=>`<li>${check}<div>${a}<small>${b}</small></div></li>`).join("")}</ul>`;
  body+=`<div class="sec">İndirilecek</div><p style="margin:0">${p.size}</p>`;
  let foot;
  if(p.installed){
    foot=`<div class="row" style="margin-bottom:8px"><span class="hint">“${p.installed}” bottle'ında kurulu</span></div><div class="row"><button class="btn sec2">Bottle'a git</button><button class="btn wide">Aç</button></div>`;
  }else if(S.job&&S.job.id===p.id){
    const steps=["Bottle hazırlanıyor","Kurulum dosyası indiriliyor","Kuruluyor","Ayarlar uygulanıyor"];
    foot=`<ul class="list st">${steps.map((s,i)=>`<li class="${i<S.job.step?"done":i===S.job.step?"now":""}">${i<S.job.step?`<span style="color:var(--ok)">${check}</span>`:i===S.job.step?'<span class="spin"></span>':'<span class="circ"></span>'}<div>${s}${i===1&&S.job.step===1?`<div class="bar"><i style="width:${S.job.pct}%"></i></div>`:""}</div></li>`).join("")}</ul><p class="hint" style="margin:8px 0 0">Bu sırada başka programlara göz atabilirsin.</p>`;
  }else{
    foot=`<label class="lab">Bottle adı</label><input class="inp" id="bname" value="${p.n}"><div class="row"><span class="hint">${p.time} · internet gerekli</span><span style="flex:1"></span><button class="btn" data-act="install">Kur</button></div>`;
  }
  $("insp").innerHTML=`<div class="ibody">${body}</div><div class="foot">${foot}</div>`;
}
function render(){renderChips();renderSections();renderInsp();renderBottles()}

function install(p){
  const name=($("bname")&&$("bname").value.trim())||p.n;
  S.job={id:p.id,step:0,pct:0};renderInsp();
  const t=setInterval(()=>{
    const j=S.job;
    if(j.step===1){j.pct+=9;if(j.pct>=100)j.step=2}else j.step++;
    if(j.step>=4){clearInterval(t);p.installed=name;S.bottles.push({n:name,bg:p.bg,m:p.m});S.job=null;render();return}
    renderInsp();
  },420);
}

document.addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(c){S.cat=c.dataset.c;render();return}
  const cd=e.target.closest(".card");if(cd){S.sel=cd.dataset.id;S.unlisted=false;render();return}
  if(e.target.closest("#drop")){S.unlisted=true;render();return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const p=P.find(x=>x.id===S.sel);
  if(a.dataset.act==="install")install(p);
  if(a.dataset.act==="notify"){S.notify.has(p.id)?S.notify.delete(p.id):S.notify.add(p.id);renderInsp()}
  if(a.dataset.act==="unlisted"){S.unlisted=true;render()}
  if(a.dataset.act==="back"){S.unlisted=false;render()}
});
$("q").addEventListener("input",e=>{S.q=e.target.value;const v=visible();if(v.length&&!v.some(p=>p.id===S.sel)){S.sel=(v.find(ready)||v[0]).id}renderSections();renderInsp()});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="f"){e.preventDefault();$("q").focus()}
  if(e.key==="Escape"&&document.activeElement===$("q")){$("q").value="";S.q="";renderSections();renderInsp()}
  if(e.key==="Enter"&&document.activeElement===$("q")){const p=P.find(x=>x.id===S.sel);if(p&&ready(p)&&!p.installed&&!S.job)install(p)}
});
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$("dropov").classList.add("on")}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();if(ev==="drop"||!e.relatedTarget){$("dropov").classList.remove("on")}if(ev==="drop"){S.unlisted=true;render()}}));

function fit(){const s=Math.min(1,(innerWidth-32)/1280,(innerHeight-32)/800);const st=$("stage");st.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener("resize",fit);fit();render();
</script>
</body>
</html>
